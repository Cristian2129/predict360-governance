name: Predict360 CI - XP Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The stress simulator (JavaScript) must match evaluator.py: tests/test_simulator_parity.py
      # runs it with Node. Pinned so that the parity does not change when Node is updated.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TDD Unit Tests (Pytest)
        run: |
          python -m pytest tests/ -v --tb=short

      # A test run only: it is not versioned and Pages publishes the official run, not this one
      - name: Run the synthetic pipeline end to end
        run: |
          PYTHONPATH=. python -m src.predict360.run_pipeline --config config/synthetic.yaml