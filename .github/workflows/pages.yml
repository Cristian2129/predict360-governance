name: Predict360 dashboard - GitHub Pages

# Publishes the committee dashboard rendered from SYNTHETIC data only.
# --publish makes dashboard_render refuse any run whose meta.synthetic is false.
# TODO(B11): render the official demo run (runs/<run_id>/dashboard_data.json) instead of the fixture.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render dashboard (synthetic only)
        run: |
          PYTHONPATH=. python -m src.predict360.dashboard_render \
            --data dashboard/dashboard_data.sample.json \
            --out _site/index.html \
            --publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
