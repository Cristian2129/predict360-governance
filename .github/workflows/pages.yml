name: Predict360 dashboard - GitHub Pages

# Publishes the committee dashboard, SYNTHETIC data only (src/predict360/publish_pages.py):
# - the page of the latest official demo run (runs/official/), byte for byte, once its
#   lineage chain and file hashes verify;
# - the fixture, with its loud sample banner, while no official run exists.
# If a check fails the build fails, deploy does not run and the previous site stays online.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site from the official run (verified) or the fixture
        run: |
          PYTHONPATH=. python -m src.predict360.publish_pages --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
