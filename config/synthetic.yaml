# Run configuration for SYNTHETIC data (PCM Analytics demo and CI).
# Inside FinBank, swap this file for real.yaml: nothing else changes.
synthetic: true
seed: 42
snapshot_date: 2026-03-31            # cut-off date T

paths:
  input_dir: data/synthetic          # where the pipeline reads the extracts
  output_dir: data/synthetic         # where make_synthetic writes them
  runs_dir: runs

hmac:
  key_env: PREDICT360_HMAC_KEY       # FinBank's key always comes from this variable
  # Fallback used ONLY when synthetic is true and the variable is unset, so the
  # demo is reproducible. It pseudonymizes fake IDs and protects nothing real.
  # config.load_config rejects it in any non-synthetic config.
  demo_key: predict360-synthetic-demo-key-not-a-secret

reconciliation:
  delinquency_expected_cop_m: 58800.0
  churn_expected_cop_m: 18200.0
  tolerance_cop_m: 0.01

horizons_days: [30, 60, 90]

retention_days: null                 # RAW retention is FinBank policy; irrelevant for synthetic data

generator:
  created_at: "2026-11-10T00:00:00Z" # fixed so that outputs are byte-identical across runs
  immature_pct: 0.05                 # rows whose observation ends before T + H

  delinquency:
    n_rows: 500
    weight: 250.0                    # 500 x 250 = 125,000 clients
    horizons_days: [30, 60]
    exposure_lognormal_sigma: 1.0    # heavy tail: many small loans, few large ones
    utilization_beta: [2.0, 2.5]
    utilization_scale: 1.2           # contract allows up to 1.5
    prior_late_lambda: 0.4
    tenure_months_range: [1, 120]
    origination_days_range: [30, 1800]
    observation_days_range: [60, 120] # mature rows: T + 60 .. T + 120
    base_rate: {target: 0.12, min: 0.06, max: 0.20}   # event anywhere in the observation window
    latent_coefficients: {utilization: 1.2, prior_late_12m: 0.9, tenure_months: -0.4}
    latent_noise_sd: 0.5

  churn:
    n_rows: 200
    weight: 62.5                     # 200 x 62.5 = 12,500 preferred clients
    horizons_days: [90]
    preferred_top_pct: 0.10          # churn sample = top 10% of a pool by exposure
    tenure_missing_pct: 0.12         # risk R-01, kept on purpose
    exposure_lognormal_sigma: 1.0
    tenure_months_range: [3, 120]
    products_active_range: [1, 6]
    observation_days_range: [90, 150]
    base_rate: {target: 0.15, min: 0.08, max: 0.25}
    latent_coefficients: {tenure_months: -0.6, products_active: -0.5, rate_gap: 0.9}
    latent_noise_sd: 0.5

  scores:                            # SIMULATED models, not trained ones
    noise_sd: {baseline_rule: 0.8, model_a: 0.7, model_b: 0.7}
    train_end_offset_days: -91       # train_end_date = T - 91 days
    eval_start_offset_days: 0        # eval_start_date = T
