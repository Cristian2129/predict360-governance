# Data contract: loans active at T (technical spec, section 6). Enforced by Gate 1 (quality.py).
# critical: true -> a failure stops the run; otherwise it needs a waiver in the manifest.
name: delinquency_v1
version: v1
table: delinquency
description: One row per sampled active loan at cut-off date T; weight = clients represented.
columns:
  client_id:
    type: string
    format: sha256_hex
    required: true
    unique: true
    critical: true
  snapshot_date:
    type: date
    required: true
    critical: true
  exposure_cop_m:
    type: decimal
    required: true
    min: 0
    min_exclusive: true
    critical: true
  weight:
    type: decimal
    required: true
    min: 0
    min_exclusive: true
    critical: true
  origination_date:
    type: date
    required: true
    before: snapshot_date
    critical: true
  utilization:
    type: decimal
    required: false
    min: 0
    max: 1.5
    critical: false
  prior_late_12m:
    type: integer
    required: false
    min: 0
    critical: false
  max_dpd_12m:
    type: integer
    required: false
    min: 0
    critical: false
  tenure_months:
    type: integer
    required: false
    min: 0
    max_null_pct: 0.05
    critical: false
  first_delinquency_date:
    type: date
    required: false
    after: snapshot_date
    critical: false
  observation_end_date:
    type: date
    required: true
    after: snapshot_date
    critical: true
